{% extends "base.html" %}
{% block title %}Sign in - Git Gateway{% endblock %}
{% block body %}
<div class="main" style="max-width:420px;margin:14vh auto">
  <div class="card" style="text-align:center">
    <h1><span class="logo"><span class="dot"></span></span> Git Gateway</h1>
    <p class="lead">Sign in to the panel.</p>
    <form method="post">
      {{ csrf_field() }}
      <input type="text" name="username" placeholder="Username" required
        autocomplete="username" style="width:80%;margin-bottom:10px">
      <br><input type="password" name="pw" placeholder="Password" required
        autocomplete="current-password" style="width:80%;margin-bottom:10px">
      <br><button>Sign in</button>
    </form>
    <p class="help credit" style="display:block;margin-top:18px">Developed by
      <a href="https://github.com/Emad-Farag" target="_blank" rel="noopener">Emad Farag</a></p>
  </div>
</div>
{% endblock %}
